[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12,<4"
dependencies = [
  "fastapi[standard]>=0.162,<1",
  "sqlalchemy[asyncio]>=2.1,<3",
  "alembic>=1.20,<2",
  "aiosqlite>=0.21",
  "asyncpg>=0.32",
  "pydantic-settings>=2.2",
  "slowapi==0.1.10",
  "captcha==0.7.1",
  "itsdangerous>=2.2",
  "redis>=5",
]

[project.optional-dependencies]
worker = ["celery[redis]>=5.6"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.17",
  "mypy>=1.14",
  "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["captcha.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
